name: Validate
on:
  push:
  pull_request:
  schedule:
    - cron: "17 4 * * 1"  # weekly, to catch breaking HA/HACS changes
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check custom_components tests
      - run: python -m pytest -q --cov=custom_components.security_monitor --cov-report=term-missing --cov-fail-under=90
      - run: docker compose config --quiet
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
