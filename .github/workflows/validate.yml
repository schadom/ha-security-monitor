name: Validate
on:
  push:
  pull_request:
  schedule:
    - cron: "17 4 * * 1"  # weekly, to catch breaking HA/HACS changes
  workflow_dispatch:
jobs:
  # Minimum supported Home Assistant (hacs.json), pinned in requirements-dev.txt.
  # The job name "tests" is a required check for main; keep it.
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check custom_components tests
      - run: python -m pytest -q --cov=custom_components.security_monitor --cov-report=term-missing --cov-fail-under=90
      - run: docker compose config --quiet
  # Newest Home Assistant the test harness supports. The harness pins one HA
  # version per release and lags new HA releases by a few days; it also ships
  # some betas, which this job then tests. The weekly run picks up new releases.
  tests-latest:
    name: tests (latest HA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install the newest test harness and its Home Assistant version
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest-homeassistant-custom-component psutil
          frontend=$(python -c "import json, os, homeassistant.components.frontend as f; print(json.load(open(os.path.join(os.path.dirname(f.__file__), 'manifest.json')))['requirements'][0])")
          python -m pip install "$frontend"
          version=$(python -c "import homeassistant.const as c; print(c.__version__)")
          echo "Testing against Home Assistant $version"
          echo "Tested against Home Assistant **$version**" >> "$GITHUB_STEP_SUMMARY"
      - run: python -m pytest -q --cov=custom_components.security_monitor --cov-report=term-missing --cov-fail-under=90
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
