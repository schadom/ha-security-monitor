name: security-monitor-dev

services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:2026.10.3
    ports:
      - "127.0.0.1:${HA_PORT:-8123}:8123"
    environment:
      TZ: ${TZ:-Europe/Vienna}
    volumes:
      - ha-config:/config
      - ./dev/configuration.yaml:/config/configuration.yaml:ro
      - ./custom_components/security_monitor:/config/custom_components/security_monitor:ro

volumes:
  ha-config:
